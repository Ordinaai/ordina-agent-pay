services:
  - type: web
    name: ordina-agent-pay
    runtime: node
    plan: starter # paid: needed for the persistent disk
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: RELEASE_DELAY_HOURS
        value: "24"
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: DEMO_SELLER_MERCHANT_ID
        sync: false
      - key: DEMO_SELLER_EMAIL
        sync: false
      - key: DAILY_TURN_CAP
        value: "400"

services:
  - type: web
    name: ordina-agent-pay
    runtime: node
    plan: starter # paid: needed for the persistent disk
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: TURNS_PER_IP_PER_HOUR
        value: "30"
      - key: DAILY_TURN_CAP
        value: "400"
      # Set these in the Render dashboard (never in this file)
      # Claude: set ONE of these. CENCORI_API_KEY reaches Claude through the Cencori gateway.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CENCORI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SELLER_MERCHANT_ID
        sync: false
      - key: PUBLIC_URL
        sync: false

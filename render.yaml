services:
  - type: web
    name: ordina-agent-checkout
    runtime: node
    # Free plan. The server pings its own address every 10 minutes (server/keep-awake.ts), so it
    # does not sleep. Free has no disk: the database lives on the instance and starts again (with
    # the demo businesses) when Render restarts the service. One always-on service is ~720 of the
    # workspace's 750 free hours a month.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: TURNS_PER_IP_PER_HOUR
        value: "30"
      - key: DAILY_TURN_CAP
        value: "400"
      # Set these in the Render dashboard (never in this file)
      # Claude: set ONE of these. CENCORI_API_KEY reaches Claude through the Cencori gateway.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CENCORI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SELLER_MERCHANT_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
